name: Build Android App (APK & Play Store AAB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android Hybrid App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK (For Local Phone Testing)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build Release Bundle (AAB for Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Sign Release AAB (if Keystore Secret is configured)
        id: sign_aab
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release-key.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEY_PASSWORD }}" \
              $AAB_PATH "${{ secrets.KEY_ALIAS }}"
            echo "AAB signed successfully with repository secret key."
          else
            echo "No KEYSTORE_BASE64 secret provided. If release-key.jks exists in repo, signing with it..."
            if [ -f "release-key.jks" ]; then
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore release-key.jks \
                -storepass "${{ secrets.KEYSTORE_PASSWORD || 'gasagency123' }}" \
                $AAB_PATH "${{ secrets.KEY_ALIAS || 'gasagency' }}" || true
            fi
          fi

      - name: Upload Debug APK (Test on Phone)
        uses: actions/upload-artifact@v4
        with:
          name: GasAgency-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: GasAgency-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

