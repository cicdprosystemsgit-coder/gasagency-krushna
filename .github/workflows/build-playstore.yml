name: Build Android App (APK & Play Store AAB)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Hybrid App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21 (Required by Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Android 36 SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK (For Local Phone Testing)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release Bundle (AAB for Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Sign Release AAB (if Keystore Secret is configured)
        id: sign_aab
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release-key.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.KEY_PASSWORD }}" \
              $AAB_PATH "${{ secrets.KEY_ALIAS }}"
            echo "AAB signed successfully with repository secret key."
          else
            echo "Checking for repo release-key.jks..."
            if [ -f "release-key.jks" ]; then
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore release-key.jks \
                -storepass "gasagency123" \
                $AAB_PATH "gasagency" || true
            fi
          fi

      - name: Upload Debug APK (Test on Phone)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GasAgency-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GasAgency-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 30
