# /etc/logrotate.d/gasagency-nginx
#
# Rotates Nginx access + error logs daily.
# Format: gasagency_logs_YYYYMMDD.log (matches app log convention)
# Size limit: 100MB per chunk — if a day's log hits 100MB, logrotate
#             creates a new numbered file before the daily date rotation.
#
# Install on VPS:
#   sudo cp /home/deploy/gasagency/gasagency/nginx/logrotate-nginx.conf /etc/logrotate.d/gasagency-nginx
#   sudo logrotate -d /etc/logrotate.d/gasagency-nginx   # dry-run test

/var/lib/docker/volumes/gasagency_nginx_logs/_data/*.log {
    # Rotate daily and when file exceeds 100 MB (creates numbered chunks same day)
    daily
    size 100M

    # Date-based suffix — matches gasagency_logs_YYYYMMDD format
    dateext
    dateformat _%Y%m%d

    # Keep 30 days of logs
    rotate 30

    # Don't error if log file is missing (e.g. first boot)
    missingok

    # Don't rotate empty files
    notifempty

    # Compress rotated files (gzip) — saves ~90% space
    compress
    delaycompress       # compress previous rotation, not the current one

    # Copy-and-truncate — safe for Docker volume-mounted files
    # (Nginx doesn't need to be signalled to reopen)
    copytruncate

    # Rename rotated file to match gasagency_logs_YYYYMMDD.log pattern
    postrotate
        # The dateext above already adds _YYYYMMDD — rename to match our convention
        for f in /var/lib/docker/volumes/gasagency_nginx_logs/_data/access.log_*.gz \
                 /var/lib/docker/volumes/gasagency_nginx_logs/_data/error.log_*.gz; do
            base=$(basename "$f")
            dir=$(dirname "$f")
            date_part=$(echo "$base" | grep -oP '_\d{8}')
            type_part=$(echo "$base" | grep -oP '^\w+')
            new_name="gasagency_nginx_${type_part}${date_part}.log.gz"
            [ -f "$f" ] && mv "$f" "${dir}/${new_name}" 2>/dev/null || true
        done
    endscript
}
