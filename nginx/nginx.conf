user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version from error pages / headers
    server_tokens off;

    # ─── Logging ─────────────────────────────────────────────────────────────
    # Nginx writes to /var/log/nginx/ — logrotate on the VPS host handles rotation
    # (see /etc/logrotate.d/gasagency-nginx installed by deploy.sh)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main buffer=16k flush=5s;

    # ─── Performance ─────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 20M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # ─── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # ─── Rate Limiting zones ─────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=30r/m;
    limit_req_zone  $binary_remote_addr zone=login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # ─── SSL shared settings ─────────────────────────────────────────────────
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # DH params (generate on VPS: openssl dhparam -out ./nginx/dhparam.pem 2048)
    ssl_dhparam /etc/nginx/dhparam.pem;

    # Modern ciphers — A+ on SSL Labs
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ─── HTTP → HTTPS redirect ───────────────────────────────────────────────
    server {
        listen 80;
        server_name dev.agency.cicdprosystems.com;

        # Let's Encrypt ACME challenge — must be before redirect
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS Main Server ───────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name dev.agency.cicdprosystems.com;

        ssl_certificate     /etc/letsencrypt/live/dev.agency.cicdprosystems.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.agency.cicdprosystems.com/privkey.pem;

        # ─── Security Headers ─────────────────────────────────────────────
        add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "DENY"                                          always;
        add_header X-Content-Type-Options     "nosniff"                                       always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
        add_header X-Permitted-Cross-Domain-Policies "none"                                   always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;

        # ─── Block scanners & bad bots ────────────────────────────────────
        if ($http_user_agent ~* (nmap|nikto|sqlmap|acunetix|havij|masscan|zgrab)) {
            return 403;
        }

        # ─── Static Assets ────────────────────────────────────────────────
        location /_next/static/ {
            proxy_pass http://app:3000/_next/static/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ─── Auth endpoints — strict rate limit (5 req/min, burst 5) ─────
        location /api/auth/ {
            limit_req  zone=login burst=5 nodelay;
            limit_conn perip 10;
            proxy_pass             http://app:3000/api/auth/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        # ─── API routes — standard rate limit (30 req/min, burst 20) ─────
        location /api/ {
            limit_req  zone=api burst=20 nodelay;
            limit_conn perip 20;
            proxy_pass             http://app:3000/api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ─── Next.js pages + WebSocket ────────────────────────────────────
        location / {
            proxy_pass         http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         "upgrade";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_read_timeout 60s;
            proxy_buffering    off;
        }
    }
}
