# ─── Gasagency — Production PostgreSQL Config ─────────────────────────────────
# PgBouncer sits in front; Postgres only needs to serve PgBouncer's server conns.

# Connections
max_connections = 50            # PgBouncer pools into these 50 slots
superuser_reserved_connections = 3

# Memory
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 16MB

# Checkpoints
checkpoint_completion_target = 0.9
wal_level = replica

# Performance
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Logging — security + slow query audit
log_destination = 'stderr'
logging_collector = off           # Docker captures stderr already
log_connections = on
log_disconnections = on
log_duration = off
log_min_duration_statement = 500  # Log queries slower than 500 ms
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_lock_waits = on

# Security
password_encryption = scram-sha-256
ssl = off                         # SSL terminated at Nginx; internal net is trusted
